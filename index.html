<!DOCTYPE html><html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Amar Premium Store</title><style>

body{
font-family:Arial;
margin:0;
background:#f4f1ec;
}

.dark{
background:#111;
color:white;
}

header{
background:#4b2e2e;
color:white;
padding:15px;
text-align:center;
font-size:22px;
}

.container{
padding:15px;
max-width:1100px;
margin:auto;
}

.product{
background:white;
padding:15px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.product img{
width:100%;
max-width:300px;
border-radius:10px;
}

.price{
color:#b12704;
font-weight:bold;
}

button{
background:#4b2e2e;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
margin-top:5px;
}

input,textarea,select{
width:100%;
padding:8px;
margin-top:5px;
margin-bottom:10px;
}

.review-box{
background:#eee;
padding:8px;
margin-top:5px;
border-radius:5px;
}

.popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
}

.popup-content{
background:white;
padding:20px;
width:90%;
max-width:400px;
border-radius:10px;
}

.toast{
position:fixed;
bottom:20px;
right:20px;
background:#333;
color:#fff;
padding:10px;
border-radius:5px;
}

</style></head><body><header>Amar Premium Store ⭐⭐⭐⭐⭐

<br><button onclick="toggleDark()">Dark Mode</button>

<button onclick="customerLogin()">Customer Login</button>

<button onclick="adminLogin()">Admin</button>

</header><div class="container"><input type="text" id="search" placeholder="Search product..." onkeyup="searchProduct()"><h3>Cart</h3><div id="cartList"></div><hr><div class="product"><h2>Amar Coffee Powder (450gm)</h2><img src="product.png"><p class="price">₹12999</p><input type="number" id="qty1" value="1" min="1" onchange="updateTotal(12999,'qty1','total1')"><p>Total: ₹<span id="total1">12999</span></p><button onclick="addToCart('Coffee Powder',12999)">Add To Cart</button>

<button onclick="openForm('Coffee Powder',12999,'450gm','qty1')">Pay Now</button>

<div id="reviews1"></div><input type="text" id="name1" placeholder="Name"><textarea id="text1" placeholder="Review"></textarea><select id="rating1">
<option>⭐⭐⭐⭐⭐</option>
<option>⭐⭐⭐⭐</option>
<option>⭐⭐⭐</option>
<option>⭐⭐</option>
<option>⭐</option>
</select><button onclick="addReview('reviews1','name1','text1','rating1')">Submit Review</button>

</div><h3>Track Order</h3><input type="text" id="trackId" placeholder="Order ID"><button onclick="trackOrder()">Track</button>

<button onclick="cancelOrder()">Cancel</button>

<div id="trackResult"></div><h3>My Orders</h3><button onclick="showOrders()">Show Orders</button>

<div id="orderList"></div></div><div class="popup" id="paymentPopup"><div class="popup-content"><h3>Customer Details</h3><input type="text" id="custName" placeholder="Name"><input type="text" id="custPhone" placeholder="Phone"><textarea id="custAddress" placeholder="Address"></textarea><p>Scan & Pay</p><img src="qr.png" width="100%"><p>UPI: vishaltiwari8960@ptaxis</p><button onclick="confirmPayment()">I Paid</button>

<button onclick="closePopup()">Close</button>

</div></div><script>

let currentProduct,currentPrice,currentWeight,currentQty;

let cart=[];

/* TOTAL */

function updateTotal(price,qtyId,totalId){

let qty=document.getElementById(qtyId).value;

document.getElementById(totalId).innerText=price*qty;

}

/* CART */

function addToCart(name,price){

cart.push({name,price});

showCart();

showToast("Added to cart");

}

function showCart(){

let html="";
let total=0;

cart.forEach(i=>{
html+=i.name+" ₹"+i.price+"<br>";
total+=i.price;
});

html+="<br>Total ₹"+total;

document.getElementById("cartList").innerHTML=html;

}

/* PAYMENT */

function openForm(product,price,weight,qtyId){

currentProduct=product;
currentPrice=price;
currentWeight=weight;
currentQty=document.getElementById(qtyId).value;

document.getElementById("paymentPopup").style.display="flex";

}

function closePopup(){

document.getElementById("paymentPopup").style.display="none";

}

function confirmPayment(){

let name=document.getElementById("custName").value;
let phone=document.getElementById("custPhone").value;
let address=document.getElementById("custAddress").value;

if(name==""||phone==""||address==""){

alert("Fill all details");
return;

}

let delivery=50;

let total=(currentPrice*currentQty)+delivery;

let orderId="ORD"+Math.floor(Math.random()*100000);

let date=new Date().toLocaleDateString();

let data={

id:orderId,
product:currentProduct,
quantity:currentQty,
total:total,
date:date,
status:"Processing"

};

localStorage.setItem(orderId,JSON.stringify(data));

let msg="Order ID:"+orderId+
"\nProduct:"+currentProduct+
"\nQty:"+currentQty+
"\nTotal:₹"+total;

window.location.href="sms:9721770053?body="+encodeURIComponent(msg);

window.open("https://wa.me/919721770053?text="+encodeURIComponent(msg));

showToast("Order Placed "+orderId);

closePopup();

}

/* TRACK */

function trackOrder(){

let id=document.getElementById("trackId").value;

let order=localStorage.getItem(id);

if(order){

let d=JSON.parse(order);

document.getElementById("trackResult").innerHTML=

"Product:"+d.product+
"<br>Status:"+d.status+
"<br>Total:"+d.total;

}else{

document.getElementById("trackResult").innerHTML="Order not found";

}

}

/* CANCEL */

function cancelOrder(){

let id=document.getElementById("trackId").value;

let order=localStorage.getItem(id);

if(order){

let d=JSON.parse(order);

d.status="Cancelled";

localStorage.setItem(id,JSON.stringify(d));

document.getElementById("trackResult").innerHTML="Order cancelled";

}

}

/* REVIEW */

function addReview(divId,nameId,textId,ratingId){

let name=document.getElementById(nameId).value;
let text=document.getElementById(textId).value;
let rating=document.getElementById(ratingId).value;

let div=document.getElementById(divId);

div.innerHTML+="<div class='review-box'><b>"+name+"</b>: "+text+" "+rating+"</div>";

}

/* SEARCH */

function searchProduct(){

let input=document.getElementById("search").value.toLowerCase();

let items=document.getElementsByClassName("product");

for(let i=0;i<items.length;i++){

let text=items[i].innerText.toLowerCase();

items[i].style.display=text.includes(input)?"block":"none";

}

}

/* DARK MODE */

function toggleDark(){

document.body.classList.toggle("dark");

}

/* ORDERS */

function showOrders(){

let html="";

for(let i=0;i<localStorage.length;i++){

let key=localStorage.key(i);

if(key.startsWith("ORD")){

let d=JSON.parse(localStorage.getItem(key));

html+=key+" "+d.product+" ₹"+d.total+"<br>";

}

}

document.getElementById("orderList").innerHTML=html;

}

/* TOAST */

function showToast(msg){

let t=document.createElement("div");

t.className="toast";

t.innerText=msg;

document.body.appendChild(t);

setTimeout(()=>t.remove(),3000);

}

/* LOGIN */

function customerLogin(){

let name=prompt("Enter name");

localStorage.setItem("customer",name);

alert("Welcome "+name);

}

/* ADMIN */

function adminLogin(){

let pass=prompt("Admin password");

if(pass==="1234"){

alert("Admin access granted");

}else{

alert("Wrong password");

}

}

</script></body></html>
